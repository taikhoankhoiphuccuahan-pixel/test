<!DOCTYPE html>
<html lang="vi">
<head>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        dark: '#070a13', // Deep slate velvet black
                        surface: '#111827', // Rich charcoal card surface
                        primary: '#EAB308', // Radiant Gold for Royal Vibe
                        accent: '#F97316', // Fiery Orange for battles/milestones
                        goldDark: '#854D0E',
                    }
                }
            }
        }

    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #070a13;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #EAB308;
        }

        .bg-canvas {
            background-color: #070a13;
            background-image: 
                radial-gradient(rgba(234, 179, 8, 0.07) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .timeline-line::before {
            content: '';
            position: absolute;
            top: 24px;
            left: 24px;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, #EAB308 0%, #F97316 50%, transparent 100%);
            z-index: 0;
        }

        .fade-in {
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

        // --- FUNCTIONS ---

        function updateStats() {
            const era = historyData[currentEraIndex];
            statTabsCount.innerText = era.tabs.length;
            
            let totalEvents = 0;
            era.tabs.forEach(tab => {
                totalEvents += tab.events.length;
            });
            statEventsCount.innerText = totalEvents;
        }

        function renderSidebar(filteredData = historyData) {
            sidebarNav.innerHTML = '';
            
            if (filteredData.length === 0) {
                sidebarNav.innerHTML = `
                    <div class="text-center p-6 text-slate-500 text-sm">
                        <i class="ph ph-magnifying-glass text-3xl mb-2 block mx-auto text-slate-600"></i>
                        Không tìm thấy sự kiện nào trùng khớp.
                    </div>
                `;
                return;
            }

            filteredData.forEach((era) => {
                // Find original index in master historyData array
                const originalIndex = historyData.findIndex(h => h.id === era.id);
                const isActive = originalIndex === currentEraIndex;

                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3.5 rounded-xl transition-all duration-300 flex items-center gap-3.5 ${isActive ? 'bg-primary/10 text-primary border border-primary/30 shadow-[0_4px_20px_rgba(234,179,8,0.08)]' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'}`;
                btn.innerHTML = `
                    <div class="p-2 rounded-lg ${isActive ? 'bg-primary/20 text-primary' : 'bg-slate-900 text-slate-500'}">
                        <i class="ph ${era.icon} text-lg"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-medium text-sm truncate ${isActive ? 'text-white font-semibold' : 'text-slate-300'}">${era.title}</p>
                        <p class="text-[10px] text-slate-500 truncate mt-0.5">${era.tabs.length} Triều đại / Phân kỳ</p>
                    </div>
                `;
                btn.onclick = () => {
                    if (currentEraIndex !== originalIndex) {
                        currentEraIndex = originalIndex;
                        currentTabIndex = 0; // Reset tab on era change
                        updateUI();
                    }
                };
                sidebarNav.appendChild(btn);
            });
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            const era = historyData[currentEraIndex];

                const isActive = index === currentTabIndex;
                const tabDiv = document.createElement('button');
                tabDiv.className = `shrink-0 text-left cursor-pointer group relative pb-3 px-1 transition-all focus:outline-none ${isActive ? 'opacity-100' : 'opacity-50 hover:opacity-100'}`;
                
                tabDiv.innerHTML = `
                    <div class="text-[10px] font-bold tracking-widest uppercase mb-1 ${isActive ? 'text-primary' : 'text-slate-500 group-hover:text-slate-400'}">${tab.year}</div>
                    <div class="text-base font-serif font-semibold ${isActive ? 'text-white' : 'text-slate-300'}">${tab.name}</div>
                    <!-- Active Indicator line -->
                    <div class="absolute bottom-0 left-0 w-full h-[3px] rounded-t-full transition-all duration-300 ${isActive ? 'bg-gradient-to-r from-primary to-accent' : 'bg-transparent'}"></div>
                `;
                
                tabDiv.onclick = () => {
                    if (currentTabIndex !== index) {
                        currentTabIndex = index;
                        quizState = null; // reset quiz state when changing tab
                        renderCanvas();
                        renderTabs(); // Re-render to update active styling
                    }
                };
                tabsContainer.appendChild(tabDiv);
            });
        }

        function generateQuiz() {
            const era = historyData[currentEraIndex];
            const tab = era.tabs[currentTabIndex];
            
            if (!tab || tab.events.length < 2) {
                return null; // Need at least 2 events to construct a question with distractors
            }

            // Pick a random event from current tab
            const eventIndex = Math.floor(Math.random() * tab.events.length);
            const targetEvent = tab.events[eventIndex];

            // Decide question type: 0 = "What event happened in Year?", 1 = "When did Event occur?"
            const qType = Math.floor(Math.random() * 2);
            let question = "";
            let correct = "";
            let explanation = targetEvent.desc;
            let options = [];

            if (qType === 0) {
                question = `Sự kiện lịch sử hào hùng nào diễn ra vào mốc thời gian: <span class="text-primary font-bold font-serif">${targetEvent.date}</span>?`;
                correct = targetEvent.title;
                
                options.push(correct);
                // Grab distractors from other events in the same era or others
                let allEraEvents = [];
                era.tabs.forEach(t => {
                    t.events.forEach(ev => {
                        if (ev.title !== correct) allEraEvents.push(ev.title);
                    });
                });

                // Shuffle and pick 2 distractors
                allEraEvents = allEraEvents.sort(() => 0.5 - Math.random());
                options.push(...allEraEvents.slice(0, 2));
            } else {
                question = `Mốc lịch sử <span class="text-primary font-bold font-serif">"${targetEvent.title}"</span> đã diễn ra vào năm/giai đoạn nào?`;
                correct = targetEvent.date;

                options.push(correct);
                let allEraDates = [];
                era.tabs.forEach(t => {
                    t.events.forEach(ev => {
                        if (ev.date !== correct) allEraDates.push(ev.date);
                    });
                });

                allEraDates = allEraDates.sort(() => 0.5 - Math.random());
                options.push(...allEraDates.slice(0, 2));
            }

            // Shuffle the options so correct answer isn't always first
            options = options.sort(() => 0.5 - Math.random());

            return {
                question,
                options,
                correct,
                explanation,
                answered: false,
                selectedAnswer: null
            };
        }

        function selectQuizAnswer(option) {
            if (quizState.answered) return;

            quizState.answered = true;
            quizState.selectedAnswer = option;

            const isCorrect = option === quizState.correct;
            if (isCorrect) {
                quizScore++;
            }

            // Render updated quiz container inside the board immediately
            renderQuizCard();
        }

        function renderQuizCard() {
            const quizContainer = document.getElementById('quiz-widget');
            if (!quizContainer || !quizState) return;

            let optionsHtml = '';
            quizState.options.forEach(opt => {
                let btnStyle = 'border-slate-800 bg-slate-900/60 hover:bg-slate-900 hover:border-slate-700 text-slate-300';
                let iconHtml = '';

                if (quizState.answered) {
                    if (opt === quizState.correct) {
                        btnStyle = 'border-emerald-500/50 bg-emerald-500/10 text-emerald-300';
                        iconHtml = '<i class="ph ph-check-circle text-xl text-emerald-400 shrink-0"></i>';
                    } else if (opt === quizState.selectedAnswer) {
                        btnStyle = 'border-rose-500/50 bg-rose-500/10 text-rose-300';
                        iconHtml = '<i class="ph ph-x-circle text-xl text-rose-400 shrink-0"></i>';
                    } else {
                        btnStyle = 'border-slate-800/40 bg-slate-900/20 text-slate-500 cursor-not-allowed';
                    }
                }

                optionsHtml += `
                    <button onclick="selectQuizAnswer('${opt.replace(/'/g, "\\'")}')" 
                            ${quizState.answered ? 'disabled' : ''}
                            class="w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between gap-3 text-sm font-medium ${btnStyle}">
                        <span>${opt}</span>
                        ${iconHtml}
                    </button>
                `;
            });

            let feedbackHtml = '';
            if (quizState.answered) {
                const isCorrect = quizState.selectedAnswer === quizState.correct;
                feedbackHtml = `
                    <div class="mt-6 p-4 rounded-xl ${isCorrect ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-rose-500/10 border border-rose-500/20'} fade-in">
                        <div class="flex items-center gap-2 mb-2">
                            <i class="ph ${isCorrect ? 'ph-sparkle text-emerald-400' : 'ph-info text-rose-400'} text-xl"></i>
                            <h4 class="font-bold text-sm text-white">${isCorrect ? 'Tuyệt vời! Câu trả lời chính xác.' : 'Chưa đúng rồi! Hãy cùng ôn lại lịch sử.'}</h4>
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed">${quizState.explanation}</p>
                    </div>
                `;
            }

            quizContainer.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-800/60 pb-3 mb-4">
                    <h4 class="text-sm font-serif text-slate-300 font-bold flex items-center gap-2">
                        <i class="ph ph-exam text-primary text-lg"></i> Trắc Nghiệm Sử Ký Nhanh
                    </h4>
                    <span class="text-xs bg-slate-800 px-2.5 py-1 rounded-md text-slate-400 font-semibold">Điểm: ${quizScore}</span>
                </div>
                
                <p class="text-slate-200 text-sm mb-4 font-medium leading-relaxed">${quizState.question}</p>
                
                <div class="space-y-3">
                    ${optionsHtml}
                </div>
                
                ${feedbackHtml}
                
                ${quizState.answered ? `
                    <button onclick="reloadQuiz()" class="mt-4 w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-white rounded-lg transition-all flex items-center justify-center gap-1.5">
                        <i class="ph ph-arrows-counter-clockwise text-base"></i> Làm Câu Hỏi Khác
                    </button>
                ` : ''}
            `;
        }

        function reloadQuiz() {
            quizState = generateQuiz();
            renderQuizCard();
        }

        function renderCanvas() {
            const era = historyData[currentEraIndex];
            const tab = era.tabs[currentTabIndex];

            // Trigger smooth re-animation of the board content
            canvasBoard.classList.remove('fade-in');
            void canvasBoard.offsetWidth; 
            canvasBoard.classList.add('fade-in');

            // Generate Quiz State for this current tab
            if (!quizState) {
                quizState = generateQuiz();
            }

            let html = `
                <div class="max-w-4xl mx-auto space-y-10">
                    <!-- Overview Card -->
                    <div class="glass-panel p-6 md:p-8 rounded-3xl border-l-4 border-l-primary shadow-xl shadow-black/40 relative overflow-hidden">
                        <div class="absolute -right-12 -top-12 opacity-5 pointer-events-none">
                            <i class="ph ph-scroll text-[160px] text-primary"></i>
                        </div>
                        <h3 class="text-lg md:text-xl font-serif text-white mb-3 flex items-center gap-2.5">
                            <i class="ph ph-map-trifold text-primary text-2xl"></i> Sơ đồ Tổng quan Triều Đại
                        </h3>
                        <p class="text-slate-300 text-base md:text-lg leading-relaxed font-serif italic">${tab.overview}</p>
                    </div>

                    <!-- Timeline Events -->
                    <div class="relative timeline-line pl-12 space-y-10 pb-8">
            `;

            tab.events.forEach((event, idx) => {
                html += `
                    <div class="relative group cursor-pointer" onclick="openModal(${idx})">
                        <!-- Node Point with golden aura glow -->
                        <div class="absolute -left-12 top-2 w-6 h-6 rounded-full bg-dark border-[4px] border-primary z-10 shadow-[0_0_12px_rgba(234,179,8,0.5)] group-hover:scale-125 group-hover:border-accent transition-all duration-300"></div>
                        
                        <!-- Event Content Box -->
                        <div class="glass-panel p-6 rounded-2xl transition-all duration-300 hover:-translate-y-1.5 hover:shadow-2xl hover:shadow-primary/5 border border-slate-800/80 hover:border-primary/40">
                            <div class="flex items-center justify-between gap-4 mb-3">
                                <span class="inline-block px-3 py-1 bg-gradient-to-r from-primary/20 to-accent/20 text-primary text-xs font-bold rounded-lg border border-primary/20">
                                    ${event.date}
                                </span>
                                <div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1.5 text-xs text-primary font-semibold">
                                    Tìm hiểu thêm <i class="ph ph-arrow-right text-sm"></i>
                                </div>
                            </div>
                            <h4 class="text-xl md:text-2xl font-serif text-white mb-2 group-hover:text-primary transition-colors">${event.title}</h4>
                            <p class="text-slate-400 text-sm leading-relaxed truncate-3-lines">${event.desc}</p>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>

                    <!-- Quiz Block -->
                    ${quizState ? `
                        <div id="quiz-widget" class="glass-panel p-6 rounded-3xl border border-slate-800 shadow-xl bg-gradient-to-b from-slate-900/40 to-slate-950/40">
                            <!-- Quiz content will be injected by renderQuizCard -->
                        </div>
                    ` : ''}
                </div>
            `;
            
            canvasBoard.innerHTML = html;
            renderQuizCard();
        }

        function handleSearch() {
            const query = searchInput.value.toLowerCase().trim();
            if (query === '') {
                renderSidebar(historyData);
                return;
            }

            // Filter eras where either the title matches, or any of their tabs' events match
            const filtered = historyData.filter(era => {
                const eraMatch = era.title.toLowerCase().includes(query) || era.desc.toLowerCase().includes(query);
                const eventsMatch = era.tabs.some(tab => {
                    return tab.name.toLowerCase().includes(query) || tab.events.some(ev => {
                        return ev.title.toLowerCase().includes(query) || ev.desc.toLowerCase().includes(query) || ev.date.toLowerCase().includes(query);
                    });
                });
                return eraMatch || eventsMatch;
            });

            renderSidebar(filtered);
        }

        let currentUtterance = null;
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // Cancel previous speech
                window.speechSynthesis.cancel();

                currentUtterance = new SpeechSynthesisUtterance(text);
                
                // Try to find a Vietnamese voice
                const voices = window.speechSynthesis.getVoices();
                const viVoice = voices.find(voice => voice.lang.includes('vi') || voice.lang.includes('VI'));
                if (viVoice) {
                    currentUtterance.voice = viVoice;
                }
                
                currentUtterance.rate = 0.95; // Slightly slower for better comprehension
                window.speechSynthesis.speak(currentUtterance);
            } else {
                alert("Rất tiếc, trình duyệt của bạn không hỗ trợ tính năng chuyển văn bản thành giọng nói (TTS).");
            }
        }

        function openModal(eventIdx) {
            const era = historyData[currentEraIndex];
            const tab = era.tabs[currentTabIndex];
            const event = tab.events[eventIdx];

            modalDate.innerText = event.date;
            modalTitle.innerText = event.title;
            modalDesc.innerHTML = `
                <div class="space-y-4">
                    <p class="text-lg font-serif italic text-slate-200 border-l-2 border-primary pl-4 py-1">${event.desc}</p>
                    <p class="text-xs text-slate-500 uppercase font-semibold tracking-wider pt-4 border-t border-slate-800">Thông tin bối cảnh</p>
                    <p class="text-sm text-slate-400">Sự kiện này thuộc phân kỳ lịch sử <strong class="text-slate-300">${tab.name} (${tab.year})</strong> thuộc vương triều/kỷ nguyên vĩ mô <strong class="text-slate-300">${era.title}</strong> của Lịch sử Việt Nam.</p>
                </div>
            `;
            
            // Wire TTS buttons
            modalTtsBtn.onclick = () => {
                const fullTextToRead = `${event.title}. Mốc thời gian ${event.date}. ${event.desc}`;
                speakText(fullTextToRead);
            };

            detailModal.classList.remove('hidden');
            detailModal.classList.add('fade-in');
        }

        function closeModal() {
            detailModal.classList.add('hidden');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop talking on modal close
            }
        }

        function updateUI() {
            const era = historyData[currentEraIndex];
            pageTitle.innerText = era.title;
            pageDesc.innerText = era.desc;
            
            updateStats();
            renderSidebar();
            renderTabs();
            renderCanvas();
        }

        // Initialize App
        window.onload = () => {
            updateUI();
            
            // Web Speech API needs a voice reload trigger on some browsers
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        };

        // Close modal on escape press or click outside
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) closeModal();
        });

    </script>
</body>
</html>
